server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — safe to cache for a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, so a rebuilt bundle (with new asset
    # hashes) is always picked up on the next page load.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA routing: serve index.html for any unmatched path.
    #
    # The browser loads the app from "/" (and deep hash routes resolve to "/"
    # too), NOT "/index.html", so the no-store header above never reached the
    # document the browser actually caches — it kept pinning the previous
    # hashed bundle after a rebuild until a manual hard refresh. Setting
    # no-store here (the block that serves the SPA HTML for "/" and every
    # non-asset path) is the real fix; hashed /assets/ keep their long-lived
    # immutable caching via their own, longer-prefix location above.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Proxy API calls to the backend service. The 'api' host is the
    # backend container name on the compose network.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 80M;
    }
}
